<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>2.5D 网格变形预览</title>
<style>
  body { margin: 0; font: 13px system-ui, sans-serif; background: #e9e6e1; color: #222; }
  main { display: flex; gap: 24px; padding: 20px; align-items: flex-start; }
  .stage { background: repeating-conic-gradient(#f4f2ee 0 25%, #e2ded7 0 50%) 0 0 / 24px 24px; border-radius: 8px; }
  #live { width: 512px; height: 512px; display: block; }
  form { display: grid; grid-template-columns: auto 200px 48px; gap: 8px 10px; align-items: center; }
  output { font-variant-numeric: tabular-nums; }
  #sheet { display: none; flex-wrap: wrap; gap: 12px; padding: 16px; }
  #sheet figure { margin: 0; text-align: center; }
  #sheet canvas { width: 300px; height: 300px; display: block; }
  body.sheet main { display: none; }
  body.sheet #sheet { display: flex; }
</style>
</head>
<body>
<main>
  <div class="stage"><canvas id="live" width="512" height="512"></canvas></div>
  <div>
    <form id="controls">
      <label for="auto">自动待机</label><input id="auto" type="checkbox" checked><span></span>
      <label for="follow">跟随鼠标</label><input id="follow" type="checkbox" checked><span></span>
    </form>
    <p>勾掉"自动待机"后可以用滑块单独调每个参数。</p>
  </div>
</main>
<div id="sheet"></div>
<script type="module">
import { MeshRenderer, SIT_RIG, REST, eyesOnto } from '../../src/mesh25d.js';
import { Live25D } from '../../src/live25d.js';

const params = new URLSearchParams(location.search);
const BASE = '../../assets/sprites/';
const load = (src) => new Promise((ok, fail) => {
  const img = new Image();
  img.onload = () => ok(img);
  img.onerror = () => fail(new Error(`cannot load ${src}`));
  img.src = BASE + src;
});
const [sit, ...rawBlinks] = await Promise.all(['sit/000.png', 'blink/001.png', 'blink/002.png', 'blink/003.png'].map(load));
// Same as the app: only the eyes of each blink frame, on the sit's fur.
const blinks = params.has('rawblink') ? rawBlinks : rawBlinks.map((b) => eyesOnto(sit, b));

// Slider ranges match what the app will ever use (live25d.js limits).
const SLIDERS = {
  yaw: [-0.22, 0.22, '转头'],
  pitch: [-0.15, 0.15, '低头/抬头'],
  breath: [0, 1, '呼吸'],
  ear: [-0.22, 0.22, '耳朵'],
  tail: [-0.32, 0.2, '尾巴'],
};

// ---------------------------------------------------------------- contact sheet (?sheet=...)
// ?sheet=yaw:-0.4,yaw:0.4,... renders one cell per pose; used for screenshots.
if (params.has('sheet')) {
  document.body.classList.add('sheet');
  const gl = document.createElement('canvas');
  gl.width = gl.height = 600;
  const mesh = new MeshRenderer(gl, { preserveDrawingBuffer: true });
  const spec = params.get('sheet') || 'rest,yaw:-0.22,yaw:0.22,pitch:-0.15,pitch:0.15,breath:1,ear:-0.22,tail:-0.32,yaw:0.2+pitch:0.12+blink:3';
  for (const cell of spec.split(',')) {
    const p = { ...REST };
    let image = sit;
    for (const part of cell.split('+')) {
      const [k, v] = part.split(':');
      if (k === 'blink') image = blinks[Number(v) - 1];
      else if (k in p) p[k] = Number(v);
    }
    mesh.clear();
    mesh.draw(image, p);
    const fig = document.createElement('figure');
    const c = document.createElement('canvas');
    c.width = c.height = 600;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 600, 600);
    // Crop to the cat: sprite cols 37..223, rows 70..256 fill the cell.
    const s = 600 / SIT_RIG.canvas;
    ctx.drawImage(gl, 37 * s, 70 * s, 186 * s, 186 * s, 0, 0, 600, 600);
    if (params.has('guides')) {
      ctx.strokeStyle = 'rgba(255,0,0,0.6)';
      ctx.beginPath();
      // A faint vertical centre line, to judge how far the face moved.
      const toX = (x) => ((x - 37) / 186) * 600;
      ctx.moveTo(toX(118), 0); ctx.lineTo(toX(118), 600);
      ctx.stroke();
    }
    const cap = document.createElement('figcaption');
    cap.textContent = cell;
    fig.append(c, cap);
    document.getElementById('sheet').append(fig);
  }
  document.body.dataset.ready = '1';
} else {
  // ---------------------------------------------------------------- live preview
  const canvas = document.getElementById('live');
  const mesh = new MeshRenderer(canvas);
  const form = document.getElementById('controls');
  const inputs = {};
  for (const [k, [lo, hi, label]] of Object.entries(SLIDERS)) {
    const l = document.createElement('label');
    l.textContent = label;
    l.htmlFor = k;
    const input = Object.assign(document.createElement('input'), { type: 'range', id: k, min: lo, max: hi, step: 0.01, value: 0 });
    const out = document.createElement('output');
    out.htmlFor = k;
    form.append(l, input, out);
    inputs[k] = { input, out };
  }
  const auto = document.getElementById('auto');
  const follow = document.getElementById('follow');

  let mouse = null;
  canvas.addEventListener('pointermove', (e) => {
    const r = canvas.getBoundingClientRect();
    mouse = { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
  });
  canvas.addEventListener('pointerleave', () => { mouse = null; });

  // The app's own idle animator, so this page shows exactly what the pet does.
  const live = new Live25D();
  let nextBlink = 2;
  let blinkAt = -1;
  const BLINK = [0, 1, 2, 1, 0];

  const start = performance.now();
  let last = start;
  function frame(now) {
    requestAnimationFrame(frame);
    const t = (now - start) / 1000;
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    let p;
    let image = sit;
    if (auto.checked) {
      if (t > nextBlink) { blinkAt = t; nextBlink = t + 2.5 + Math.random() * 3.5; }
      const bi = Math.floor((t - blinkAt) * 14);
      const blinking = blinkAt >= 0 && bi >= 0 && bi < BLINK.length;
      if (blinking && BLINK[bi]) image = blinks[BLINK[bi] - 1];
      // Cursor relative to the face, in sitting heights (the sit is 157 of 256 px).
      const cursor = follow.checked && mouse
        ? { dx: (mouse.x - SIT_RIG.head.cx / 256) / (157 / 256), dy: (mouse.y - 150 / 256) / (157 / 256) }
        : null;
      p = { ...live.update(dt, blinking ? 'blink' : 'sit', cursor) };
      for (const [k2, { input, out }] of Object.entries(inputs)) {
        input.value = p[k2];
        out.textContent = p[k2].toFixed(2);
      }
    } else {
      p = Object.fromEntries(Object.entries(inputs).map(([k2, { input, out }]) => {
        out.textContent = Number(input.value).toFixed(2);
        return [k2, Number(input.value)];
      }));
    }
    mesh.clear();
    mesh.draw(image, p);
  }
  requestAnimationFrame(frame);
  document.body.dataset.ready = '1';
}
</script>
</body>
</html>
